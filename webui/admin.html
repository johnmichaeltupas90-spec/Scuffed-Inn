<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Scuffed Inn Hotel admin: every reservation with its guest, room, dates, status and payment method.">
    <title>Reservations admin, Scuffed Inn Hotel</title>

    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="page-admin">
    <a class="skip" href="#main">Skip to content</a>

    <svg class="sprite" aria-hidden="true" focusable="false">
        <symbol id="i-refresh" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
        </symbol>
    </svg>

    <header class="masthead">
        <div class="container masthead__inner">
            <a class="wordmark" href="index.html">Scuffed Inn <span>Hotel</span></a>
            <nav class="nav" aria-label="Pages">
                <a href="index.html">Home</a>
                <a href="rooms.html">Rooms</a>
                <a href="reservation.html">Reservations</a>
                <a href="admin.html" aria-current="page">Admin</a>
            </nav>
        </div>
    </header>

    <main id="main">
        <header class="container admin-head">
            <div>
                <h1>Reservations</h1>
                <p class="lead">Every booking, newest stay first.</p>
            </div>

            <div class="admin-tools">
                <span id="adminCount" class="admin-count">Loading…</span>
                <button id="refreshButton" class="btn btn--small" type="button">
                    <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
                    Refresh
                </button>
            </div>
        </header>

        <div class="container admin-main">
            <p id="adminMessage" class="admin-message" role="alert"></p>

            <div class="admin-table-wrap">
                <table class="table admin-table">
                    <thead>
                        <tr>
                            <th scope="col">No.</th>
                            <th scope="col">Guest</th>
                            <th scope="col">Room</th>
                            <th scope="col">Check-in</th>
                            <th scope="col">Check-out</th>
                            <th scope="col">Nights</th>
                            <th scope="col">Status</th>
                            <th scope="col">Payment</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="reservationRows">
                        <tr>
                            <td colspan="9" class="admin-empty">Loading reservations…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="container colophon">
        <span>Scuffed Inn Hotel</span>
        <span>Reservations list, newest stay first.</span>
    </footer>

    <script src="admin.js"></script>
</body>
</html>
